<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TEST [Comic Progression]</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body {
      background-color: #0f0f0f;
      color: white;
      text-align: center;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #comic {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
    }

    img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="comic">
    <img id="comicImage" src="https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/startnote.png" alt="Soul Bled Comic">
<button id="fullscreen-btn" style="
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.6);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 14px;
  z-index: 10;
">⛶</button>

    
  </div>

  <script>
// ============================
// FULLSCREEN FEATURE
// ============================
const fullscreenBtn = document.getElementById("fullscreen-btn");
const comicContainer = document.getElementById("comic"); // ✅ Correct container

fullscreenBtn.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    comicContainer.requestFullscreen().catch(err => {
      alert(`Error attempting to enable fullscreen: ${err.message}`);
    });
  } else {
    document.exitFullscreen();
  }
});

// ============================
// COMIC IMAGES & NAVIGATION
// ============================
const images = [
  "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/startnote.png",
  "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/cover%20draft%20(1).png",
   "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/mobilepage.png",
  "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/d1.png",
  "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/d2.png",
  "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/d3.png",
  "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/d4.png",
  "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/d5.png"
];

let current = 0;
const comicImage = document.getElementById("comicImage");

function nextImage() {
  current = (current + 1) % images.length;
  comicImage.src = images[current];
}

function prevImage() {
  current = (current - 1 + images.length) % images.length;
  comicImage.src = images[current];
}

document.body.addEventListener("click", nextImage);

window.addEventListener("resize", () => {
  document.body.style.height = window.innerHeight + "px";
});

// ============================
// KEYBOARD NAVIGATION
// ============================
// (Press → to go forward, ← to go back)
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") {
    nextImage(); // go forward
  } else if (event.key === "ArrowLeft") {
    prevImage(); // go backward
  }
});
</script>

</body>
</html>
