<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soul Bled Comic Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body {
      background-color: #0f0f0f;
      color: white;
      text-align: center;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #comic {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
    }

    img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="comic">
    <img id="comicImage" src="https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/page1.png" alt="Soul Bled Comic">
  </div>

  <script>
    const images = [
      "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/page1.png",
      "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/page2.png",
      "https://raw.githubusercontent.com/quaintcy/test-comic/refs/heads/main/page3.png"
    ];

    let current = 0;
    const comicImage = document.getElementById("comicImage");

    document.body.addEventListener("click", () => {
      current = (current + 1) % images.length;
      comicImage.style.opacity = 0;
      setTimeout(() => {
        comicImage.src = images[current];
        comicImage.style.opacity = 1;
      }, 150);
    });

    window.addEventListener("resize", () => {
      document.body.style.height = window.innerHeight + "px";
    });
  </script>
</body>
</html>
